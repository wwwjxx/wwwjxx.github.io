<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXO · 韩语歌曲学习目录</title>
  <style>
    :root{--bg:#f7f4ee;--surface:#fffdf9;--surface2:#f0ebe2;--text:#27231f;--muted:#777069;--line:#e5ded2;--accent:#a34d39;--accent2:#f3ddd4;--shadow:0 18px 50px rgba(78,53,38,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0%,#fffaf0 0,#f7f4ee 42%,#efeae1 100%);color:var(--text);font-family:Inter,"Noto Sans KR","Malgun Gothic","Microsoft YaHei",sans-serif}body{padding:22px}.library{max-width:1320px;margin:0 auto}.library-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:0 auto 18px;max-width:1180px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}.library h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:8px 0}.library-top p{margin:0;color:var(--muted);font-size:14px}.mark{width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff9f2;display:grid;place-items:center;font-size:23px;box-shadow:0 10px 22px rgba(163,77,57,.25)}.library-shell{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start;max-width:1320px;margin:0 auto}.directory{position:sticky;top:18px;background:rgba(255,253,249,.82);border:1px solid rgba(229,222,210,.9);border-radius:22px;padding:13px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.directory-title{padding:8px 10px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.song-btn{display:block;width:100%;border:1px solid transparent;background:transparent;color:var(--text);text-align:left;border-radius:15px;padding:13px 12px;margin-bottom:7px}.song-btn:hover{background:var(--surface2)}.song-btn.active{background:var(--accent);color:#fffaf4;box-shadow:0 8px 16px rgba(163,77,57,.18)}.song-title{font-size:17px;font-weight:700}.song-sub{font-size:12px;margin-top:3px;opacity:.75}.directory-note{border-top:1px solid var(--line);padding:14px 10px 3px;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.65}.viewer{min-width:0;background:rgba(255,253,249,.62);border:1px solid var(--line);border-radius:24px;padding:8px;box-shadow:var(--shadow)}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 8px 9px;color:var(--muted);font-size:12px}.viewer-head strong{color:var(--text);font-size:13px}.song-frame{display:block;width:100%;height:calc(100vh - 142px);min-height:760px;border:0;border-radius:18px;background:var(--bg)}.loading{padding:36px;text-align:center;color:var(--muted)}
    @media(max-width:820px){body{padding:12px}.library-top{align-items:flex-start}.library-shell{display:block}.directory{position:static;margin-bottom:12px;display:flex;align-items:stretch;gap:7px;overflow:auto;padding:8px}.directory-title,.directory-note{display:none}.song-btn{min-width:205px;margin:0;padding:10px}.song-title{font-size:15px}.viewer{padding:5px}.viewer-head{padding:5px 6px 8px}.song-frame{height:calc(100vh - 192px);min-height:720px}}
  </style>
</head>
<body>
  <div class="library">
    <header class="library-top"><div><div class="eyebrow">EXO · Korean Song Study</div><h1>韩语歌曲学习目录</h1><p>从歌曲目录切换学习页面；每首歌都有独立的歌词、音频、词汇和语法资料。</p></div><div class="mark" aria-hidden="true">EXO</div></header>
    <div class="library-shell">
      <nav class="directory" aria-label="歌曲目录"><div class="directory-title">歌曲目录</div><button class="song-btn active" data-song="dont-go"><div class="song-title">나비소녀</div><div class="song-sub">Don't Go · 原曲精听</div></button><button class="song-btn" data-song="growl"><div class="song-title">으르렁</div><div class="song-sub">Growl · 咆哮</div></button><div class="directory-note">点击歌曲名称即可切换。学习进度分别保存在本机浏览器中。</div></nav>
      <main class="viewer"><div class="viewer-head"><strong id="currentSong">나비소녀 · Don't Go</strong><span>歌曲学习页面</span></div><iframe class="song-frame" id="songFrame" title="歌曲学习页面" src="app-original-audio/index.html"></iframe><div class="loading" id="loading" hidden>正在切换歌曲……</div></main>
    </div>
  </div>
  <script>
    const songs={
      'dont-go':{title:'나비소녀 · Don\'t Go',src:'app-original-audio/index.html'},
      growl:{title:'으르렁 · Growl',src:'growl-original-audio/index.html'},
      'been-through':{title:'지나갈 테니 · Been Through',src:'been-through-original-audio/index.html'},
      lies:{title:'거짓말 · Lies',src:'lies-original-audio/index.html'},
      'haru-haru':{title:'하루하루 · Haru Haru',src:'haru-haru-original-audio/index.html'},
      'if-you':{title:'IF YOU · BIGBANG',src:'if-you-original-audio/index.html'},
      loser:{title:'LOSER · BIGBANG',src:'loser-original-audio/index.html'}
    };
    const beenThroughButton=document.createElement('button');
    beenThroughButton.className='song-btn';
    beenThroughButton.dataset.song='been-through';
    beenThroughButton.innerHTML='<div class="song-title">지나갈 테니</div><div class="song-sub">Been Through · 顺其自然</div>';
    document.querySelector('.directory').insertBefore(beenThroughButton,document.querySelector('.directory-note'));
    const liesButton=document.createElement('button');
    liesButton.className='song-btn';
    liesButton.dataset.song='lies';
    liesButton.innerHTML='<div class="song-title">거짓말</div><div class="song-sub">Lies · 谎言</div>';
    document.querySelector('.directory').insertBefore(liesButton,document.querySelector('.directory-note'));
    const extraSongs=[['haru-haru','하루하루','Haru Haru · 一天一天'],['if-you','IF YOU','IF YOU · BIGBANG'],['loser','LOSER','LOSER · BIGBANG']];
    extraSongs.forEach(([id,title,sub])=>{const b=document.createElement('button');b.className='song-btn';b.dataset.song=id;b.innerHTML='<div class="song-title">'+title+'</div><div class="song-sub">'+sub+'</div>';document.querySelector('.directory').insertBefore(b,document.querySelector('.directory-note'))});
    const frame=document.querySelector('#songFrame'),current=document.querySelector('#currentSong'),loading=document.querySelector('#loading');
    function switchSong(id){const song=songs[id]||songs['dont-go'];document.querySelectorAll('.song-btn').forEach(b=>b.classList.toggle('active',b.dataset.song===id));current.textContent=song.title;loading.hidden=false;frame.hidden=true;frame.src=song.src+'?v=20260915-5';location.hash=id;}
    frame.addEventListener('load',()=>{loading.hidden=true;frame.hidden=false});
    document.addEventListener('click',e=>{const btn=e.target.closest('.song-btn');if(btn)switchSong(btn.dataset.song)});
    const initial=location.hash.slice(1);if(initial&&songs[initial])switchSong(initial);
  </script>
  <script>
    const frame=document.querySelector('#songFrame');
    frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;let style=doc.querySelector('#unified-floating-controls');if(!style){style=doc.createElement('style');style.id='unified-floating-controls';doc.head.appendChild(style)}style.textContent='.floating-locator,.locator{position:fixed!important;right:24px!important;bottom:24px!important}.floating-verse-toggle,.verse-toggle{position:fixed!important;right:24px!important;bottom:108px!important}@media(max-width:760px){.floating-locator,.locator{right:12px!important;bottom:12px!important}.floating-verse-toggle,.verse-toggle{right:12px!important;bottom:106px!important}}';});
  </script>
</body>
</html>
